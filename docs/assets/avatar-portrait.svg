<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Stylized portrait avatar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6f2"/>
      <stop offset="1" stop-color="#c9ded7"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#fff7ea"/>
      <stop offset="1" stop-color="#f0dcc4"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#264a52"/>
      <stop offset="1" stop-color="#142d35"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e2ae86"/>
      <stop offset="1" stop-color="#c98763"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="512" cy="520" r="378" fill="url(#halo)" opacity="0.95"/>

  <!-- shoulders -->
  <path d="M168 1024C188 828 310 746 426 716L598 716C714 746 836 828 856 1024Z" fill="url(#shirt)"/>
