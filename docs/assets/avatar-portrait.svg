  <path d="M444 650C472 700 552 700 580 650L580 692C548 738 476 738 444 692Z" fill="#a9674b" opacity="0.30"/>

  <!-- ears -->
  <ellipse cx="344" cy="512" rx="32" ry="46" fill="#d99a74"/>
  <ellipse cx="680" cy="512" rx="32" ry="46" fill="#d99a74"/>

  <!-- head -->
  <path d="M348 466C348 304 412 232 512 232C612 232 676 304 676 466V548C676 652 608 724 512 724C416 724 348 652 348 548Z" fill="url(#skin)"/>
  <path d="M390 620C416 690 462 718 512 718C562 718 608 690 634 620C620 692 574 736 512 736C450 736 404 692 390 620Z" fill="#b87556" opacity="0.18"/>

  <!-- hair -->
  <path d="M330 486C318 328 396 196 512 196C628 196 706 328 694 486C676 438 648 398 618 374C590 352 552 340 512 340C472 340 434 352 406 374C376 398 348 438 330 486Z" fill="#2a201e"/>
  <path d="M350 492C350 452 358 420 372 402L388 462L378 514Z" fill="#221918"/>
  <path d="M674 492C674 452 666 420 652 402L636 462L646 514Z" fill="#221918"/>
  <path d="M398 350C438 318 486 304 536 310C584 316 620 338 646 370C604 354 566 350 528 356C486 362 444 382 414 412C406 388 402 368 398 350Z" fill="#3a2b27" opacity="0.65"/>

  <!-- eyebrows -->
  <path d="M406 446C432 426 466 424 490 440" fill="none" stroke="#3a2824" stroke-width="10" stroke-linecap="round"/>
  <path d="M534 440C558 424 592 426 618 446" fill="none" stroke="#3a2824" stroke-width="10" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="452" cy="486" rx="12" ry="9" fill="#251b19"/>
  <ellipse cx="572" cy="486" rx="12" ry="9" fill="#251b19"/>
  <circle cx="448" cy="482" r="3.5" fill="#fff" opacity="0.8"/>
  <circle cx="568" cy="482" r="3.5" fill="#fff" opacity="0.8"/>

  <!-- glasses -->
  <rect x="390" y="446" width="122" height="76" rx="28" fill="#ffffff" opacity="0.10" stroke="#2b201d" stroke-width="7"/>
  <rect x="512" y="446" width="122" height="76" rx="28" fill="#ffffff" opacity="0.10" stroke="#2b201d" stroke-width="7"/>
  <path d="M512 480H512" stroke="#2b201d" stroke-width="7" stroke-linecap="round"/>
  <path d="M390 466L350 454M634 466L674 454" stroke="#2b201d" stroke-width="7" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M512 500L500 558C506 564 518 564 524 558" fill="none" stroke="#a96549" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- mouth -->
